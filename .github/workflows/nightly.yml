name: nightly

# Refresh the current quarter's year file. SEC keeps the in-progress quarter's
# _form345.zip updated through the quarter, so re-parsing it refreshes the
# current year. 08:00 UTC weekdays = after SEC's overnight data-set refresh.

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # SEC fetchers require a bare "<name> <email>" User-Agent (no URL/parens).
      # Set the CONTACT_EMAIL secret; the fallback is a generic placeholder that
      # SEC still accepts, so no personal address is baked into a public file.
      INSIDERKIT_SEC_USER_AGENT: "insiderkit ${{ secrets.CONTACT_EMAIL || 'contact@example.com' }}"
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build --release --bin insiderkit-cli
      - name: Refresh data
        run: ./target/release/insiderkit-cli nightly-append
        continue-on-error: true
      - name: Regenerate manifest
        run: ./target/release/insiderkit-cli manifest
      - name: Commit if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(data): nightly $(date -u +%Y-%m-%d)"
            git push
          fi
